<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOFT Help Desk</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{--bg:#000;--s1:#0d0d0d;--s2:#141414;--border:#1e1e1e;--green:#7dc464;--gdim:rgba(125,196,100,.1);--text:#f0f0f0;--dim:#555;--mid:#888;--botbg:#0b160a;--botb:rgba(125,196,100,.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--s1);flex-shrink:0}
.lw{display:flex;align-items:center;gap:10px}
.lm{width:34px;height:34px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#000;letter-spacing:-1px}
.lt{display:flex;flex-direction:column}
.ln{font-size:14px;font-weight:700;letter-spacing:2.5px}
.ls{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.sp{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:var(--gdim);padding:4px 10px;border-radius:20px;border:1px solid rgba(125,196,100,.2)}
.sd{width:5px;height:5px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.cb{display:flex;gap:6px;padding:9px 14px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--s1);flex-shrink:0;scrollbar-width:none}
.cb::-webkit-scrollbar{display:none}
.ch{flex-shrink:0;background:var(--s2);border:1px solid var(--border);color:var(--mid);padding:5px 13px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.ch:hover{background:var(--gdim);border-color:rgba(125,196,100,.35);color:var(--green)}
#chat{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:#1a1a1a transparent}
#chat::-webkit-scrollbar{width:3px}
#chat::-webkit-scrollbar-thumb{background:#1a1a1a}
.msg{display:flex;gap:8px;max-width:90%;animation:fu .25s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.bot{align-self:flex-start}
.av{width:28px;height:28px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800}
.bot .av{background:var(--green);color:#000;font-size:13px}
.user .av{background:#1c1c1c;color:var(--dim);font-size:9px}
.bb{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.65;max-width:100%}
.bot .bb{background:var(--botbg);border:1px solid var(--botb);border-radius:3px 12px 12px 12px}
.user .bb{background:#171717;border:1px solid var(--border);border-radius:12px 3px 12px 12px}
.bb p{margin-bottom:5px}.bb p:last-child{margin-bottom:0}
.bb strong{color:var(--green);font-weight:600}
.bb ul{padding-left:16px;margin:4px 0}.bb li{margin:2px 0}
.typing .bb{padding:13px 16px}
.dots{display:flex;gap:4px;align-items:center}
.dots span{width:5px;height:5px;background:var(--green);border-radius:50%;animation:bounce 1.1s infinite;opacity:.7}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.rc{background:#060f06;border:1px solid rgba(125,196,100,.25);border-radius:10px;padding:14px;margin-top:4px}
.rch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rcat{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--green);background:var(--gdim);padding:3px 8px;border-radius:4px}
.rtid{font-size:10px;color:var(--dim);font-family:monospace}
.rsm{font-size:13px;font-weight:600;margin-bottom:6px}
.rmt{font-size:12px;color:var(--mid);line-height:1.8;margin-bottom:10px}
.rmt span{color:var(--text)}
.rst{font-size:11px;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.rst::before{content:'';display:inline-block;width:5px;height:5px;background:var(--green);border-radius:50%}
.ra{display:flex;gap:7px;flex-wrap:wrap}
.rb{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .2s;font-family:inherit}
.rb.wa{background:#0e6e38;color:#fff}.rb.wa:hover{background:#0a5a2e}
.rb.cp{background:var(--s2);color:var(--mid);border:1px solid var(--border)}.rb.cp:hover{color:var(--text)}
.wl{align-self:center;text-align:center;padding:24px 16px;max-width:320px}
.wlo{width:50px;height:50px;background:var(--green);border-radius:12px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#000;letter-spacing:-1.5px}
.wl h2{font-size:18px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.wl p{font-size:13px;color:var(--dim);line-height:1.6}
.wcs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px}
.wc{background:var(--s2);border:1px solid var(--border);color:var(--mid);padding:6px 13px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit}
.wc:hover{background:var(--gdim);border-color:rgba(125,196,100,.3);color:var(--green)}
.ia{padding:10px 14px 12px;border-top:1px solid var(--border);background:var(--s1);flex-shrink:0}
.ir{display:flex;gap:8px;align-items:flex-end}
#mi{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;max-height:110px;min-height:42px;transition:border-color .2s;line-height:1.5}
#mi:focus{border-color:rgba(125,196,100,.35)}
#mi::placeholder{color:var(--dim)}
#sb{width:42px;height:42px;background:var(--green);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
#sb:hover{background:#8fd670;transform:scale(1.04)}
#sb:disabled{background:#222;cursor:not-allowed;transform:none}
#sb svg{width:17px;height:17px;fill:#000}
.ih{font-size:10px;color:var(--dim);margin-top:6px;text-align:center;letter-spacing:.3px}
</style>
</head>
<body>
<header>
  <div class="lw">
    <div class="lm">L</div>
    <div class="lt"><span class="ln">LOFT</span><span class="ls">Help Desk</span></div>
  </div>
  <div class="sp"><div class="sd"></div>Online</div>
</header>
<div class="cb">
  <button class="ch" onclick="sc('What are the house rules?')">House Rules</button>
  <button class="ch" onclick="sc('What are the operating hours?')">Hours</button>
  <button class="ch" onclick="sc('What is the monthly fee?')">Pricing</button>
  <button class="ch" onclick="sc('I want to raise a cleaning request')">Cleaning</button>
  <button class="ch" onclick="sc('I have a payment or invoice query')">Payments</button>
  <button class="ch" onclick="sc('I need help with my membership agreement')">Agreement</button>
  <button class="ch" onclick="sc('I have a legal question')">Legal</button>
  <button class="ch" onclick="sc('How do I book a meeting room?')">Meeting Room</button>
</div>
<div id="chat">
  <div class="wl">
    <div class="wlo">L</div>
    <h2>Hi, welcome to LOFT.</h2>
    <p>Ask anything about the space, membership, or house rules. You can also raise a request for cleaning, payments, agreements, or legal matters.</p>
    <div class="wcs">
      <button class="wc" onclick="sc('What are the rules at LOFT?')">Rules and policies</button>
      <button class="wc" onclick="sc('Tell me about LOFT culture')">LOFT culture</button>
      <button class="wc" onclick="sc('I want to raise a request')">Raise a request</button>
      <button class="wc" onclick="sc('My internet is not working')">Report an issue</button>
    </div>
  </div>
</div>
<div class="ia">
  <div class="ir">
    <textarea id="mi" rows="1" placeholder="Ask anything about LOFT..." onkeydown="hk(event)" oninput="ar(this)"></textarea>
    <button id="sb" onclick="send()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>
  <div class="ih">LOFT Coworking · Nagpur</div>
</div>

<script>
// ── FILL THESE IN ─────────────────────────────────────────────────────────────
const FB_CONFIG = {
  apiKey:            "AIzaSyDX0V-U0Wj_8SPVeiCgnC601HNLsOeDbSg",
  authDomain:        "loft-finance.firebaseapp.com",
  projectId:         "loft-finance",
  storageBucket:     "loft-finance.firebasestorage.app",
  messagingSenderId: "192587330227",
  appId:             "1:192587330227:web:0ef42d1d1486dda87936c6"
};
const EJ_PK       = 'oOFB5tkG6YdSTZQuc';
const EJ_SVC      = 'service_i4gknms';
const EJ_NEW_TPL  = 'template_f6xldf9';
const STAFF_EMAIL = 'help@loftcoworks.in';
const WA          = '918600888073';
// ─────────────────────────────────────────────────────────────────────────────

let db = null;
try { if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG); db = firebase.firestore(); } catch(e) {}
try { if (EJ_PK !== 'YOUR_EMAILJS_PUBLIC_KEY') emailjs.init(EJ_PK); } catch(e) {}

const SYSTEM = `You are the LOFT Coworking Help Desk AI. LOFT is a community-first coworking space in Nagpur, India — not a desk rental business. You have complete knowledge of LOFT's operations, house rules, membership terms, and culture.

LOCATIONS:
- LOFT 1: IT Park, Nagpur — 44-45 seats, 8 cabins, operational
- LOFT 2: Abhyankar Nagar, Nagpur — 125-127 seats, 8 cabins + workstations + community space, launching June 15 2026

PRICING:
- Monthly membership: Rs 7,500 per seat. Security deposit refundable. GST 18%.
- Annual revision up to 10%. Late payment 2% per month. Due 1st of each month.

OPERATING HOURS: 9 AM to 9 PM daily. After-hours needs prior written approval.

MEMBERSHIP TYPES: Private Cabin, Dedicated Desk, Hot Desk, Virtual Office

HOUSE RULES:
Access: Cards mandatory and non-transferable, replacement Rs 500. No tailgating. Visitors register at reception and must be accompanied.
Workspace: Use only your designated space. Do not exceed occupancy. No alterations without written consent. Keep cabin clean.
Guests: Only for meetings in cabin or booked meeting room. Cannot be left unaccompanied.
Noise: Loud calls and music stay inside cabin with door closed. No abusive or harassing behaviour — immediate termination.
Kitchen: Brief use only. Clean up immediately. Wash dishes right away. Food out within 24 hours. Fridge cleared every Friday.
Meeting rooms: Book in advance, first-come-first-served. Vacate on time. Damage charged to member.
Internet: Professional use only. No streaming, torrenting, crypto mining, or unauthorised hardware.
Safety: Know fire exits. Never block them. Do not tamper with CCTV or alarms. Report hazards immediately.
Parking: First-come-first-served unless assigned. No overnight parking.
Prohibited: Strictly smoke-free and vape-free. No alcohol during hours without approval. No weapons or illegal substances. No animals except declared service animals.

CHARGES:
- Lost card Rs 500. Late payment 2% per month.
- Excess occupancy Rs 500 per extra person per day.
- Meeting room overstay per 30 min: 1.5x booking rate.
- Holdover per day: 1.5x monthly fee pro-rata.
- Deep cleaning: cost plus 30% admin.
- Damage to furniture: full repair or replacement cost.

AGREEMENT: 30 days notice for termination. Month-to-month auto-renewal after initial term.

LOFT CULTURE:
LOFT is a community — a curated environment for founders, freelancers, designers, and operators building something real. A full space with the wrong energy is worse than a half-full space with the right energy.

Values: Give a damn. Say things out loud — silence is how things stay broken. Move with bias to action. Stay curious. Own it — "that's not my job" is not a sentence here. Be honest even when uncomfortable.

The six member archetypes:
- Explorer: early stage, testing ideas — needs encouragement and space
- Creative Head: designer, writer, maker — needs flow state, do not interrupt
- Builder: founder, operator — match their pace
- Visionary: big picture thinker — wants real conversation, not transactions
- Connector: knows and introduces everyone — invest in the relationship, they bring people in
- Supporter: legal, finance, HR, ops — needs respect, they keep everything running

Culture: Know member names first. Never treat a member like a transaction — lead with the human, then the admin. 2-minute rule: fix anything that takes under 2 minutes right now. Be the reason someone had a good day.

Programmes: LOFT Afterhours (evening events, everyone is in — no exceptions), Founding Member Circle (first cohort, treat them like OGs), Wishboard (community board), Flea Fair Network (how LOFT finds builder-type members), Builder Tags (archetype badges).

Inclusion: 100% women-led on the ground. Safe space — physically, emotionally, professionally. One standard for everyone. Respect is non-negotiable regardless of gender, religion, sexuality, caste, or background. LGBT+ members and colleagues belong here completely.

REQUEST HANDLING:
Categories: CLEANING (housekeeping, cleanliness, garbage, toilet, supplies, pests, repair), PAYMENT (invoice, confirmation, receipt, overdue, billing dispute), AGREEMENT (membership, contract, renewal, upgrade, onboarding, registered address), LEGAL (compliance, GST, CA queries, legal documents).

Once you identify a request, ask for all details in a single message like this:
"To raise this for you, I need a few details — please share all at once:
- Your full name
- Your cabin number and location (LOFT 1 or LOFT 2)
- Your email address
- Description of the issue"

Once they reply with all the details, confirm: "Got it. Should I raise this as a ticket and notify the LOFT team?"
After they say yes, output this at the very END of your message:
<<<REQUEST_JSON
{"category":"cleaning|payment|agreement|legal","name":"VALUE","cabin":"VALUE","email":"VALUE","description":"VALUE","summary":"VALUE"}
REQUEST_JSON>>>

TONE: Friendly, direct, brief. No jargon. Warm and human. Max 4-5 sentences for simple answers. Bullets only when listing multiple things. If unsure, say "For this one, speak directly with the LOFT team."`;

let history = [], loading = false;

async function saveTicket(r) {
  if (!db) return null;
  try {
    const ref = await db.collection('loft_tickets').add({
      category: r.category, memberName: r.name, cabin: r.cabin,
      email: r.email || '', description: r.description, summary: r.summary,
      status: 'open', assignedTo: '', staffNotes: '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      closedAt: null
    });
    return ref.id;
  } catch(e) { console.error('Firestore:', e); return null; }
}

async function sendEmail(r, tid) {
  if (EJ_PK === 'YOUR_EMAILJS_PUBLIC_KEY') return;
  try {
    await emailjs.send(EJ_SVC, EJ_NEW_TPL, {
      ticket_id: tid ? tid.slice(0,8).toUpperCase() : 'N/A',
      category: r.category.toUpperCase(),
      member_name: r.name, cabin: r.cabin,
      member_email: r.email || 'Not provided',
      description: r.description, to_email: STAFF_EMAIL
    });
  } catch(e) { console.error('EmailJS:', e); }
}

function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const wl = chat.querySelector('.wl'); if (wl) wl.remove();
  const w = document.createElement('div'); w.className = 'msg ' + role;
  const av = document.createElement('div'); av.className = 'av'; av.textContent = role === 'bot' ? 'L' : 'ME';
  const bb = document.createElement('div'); bb.className = 'bb';
  const fmt = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/((<li>.*?<\/li>\n?)+)/gs, '<ul>$1</ul>')
    .split('\n\n').map(p => '<p>' + p.replace(/\n/g,'<br>') + '</p>').join('');
  bb.innerHTML = fmt;
  w.appendChild(av); w.appendChild(bb);
  chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const w = document.createElement('div'); w.className = 'msg bot typing'; w.id = 'typing';
  w.innerHTML = '<div class="av">L</div><div class="bb"><div class="dots"><span></span><span></span><span></span></div></div>';
  chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }

async function showCard(r) {
  const tid = await saveTicket(r);
  await sendEmail(r, tid);
  const sid = tid ? tid.slice(0,8).toUpperCase() : 'LOCAL';
  const wamsg = `LOFT ${r.category.toUpperCase()} REQUEST%0A%0ATicket: %23${sid}%0AMember: ${encodeURIComponent(r.name)}%0ASpace: ${encodeURIComponent(r.cabin)}%0AEmail: ${encodeURIComponent(r.email||'N/A')}%0A%0A${encodeURIComponent(r.description)}`;
  const chat = document.getElementById('chat');
  const w = document.createElement('div'); w.className = 'msg bot'; w.style.animation = 'fu .25s ease';
  w.innerHTML = `<div class="av">L</div><div class="bb"><div class="rc">
    <div class="rch"><span class="rcat">${r.category}</span><span class="rtid">#${sid}</span></div>
    <div class="rsm">${r.summary}</div>
    <div class="rmt">Member: <span>${esc(r.name)}</span><br>Space: <span>${esc(r.cabin)}</span><br>Email: <span>${esc(r.email||'Not provided')}</span></div>
    <div class="rst">Ticket raised — team notified by email</div>
    <div class="ra">
      <a class="rb wa" href="https://wa.me/${WA}?text=${wamsg}" target="_blank">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Send on WhatsApp
      </a>
      <button class="rb cp" onclick="cpTicket(this,'${sid}','${r.category}','${esc(r.name)}','${esc(r.cabin)}',${JSON.stringify(r.description)})">Copy details</button>
    </div>
  </div></div>`;
  chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function cpTicket(btn, id, cat, name, cabin, desc) {
  navigator.clipboard.writeText(`LOFT ${cat.toUpperCase()} REQUEST\nTicket: #${id}\nMember: ${name}\nSpace: ${cabin}\n\n${desc}`)
    .then(() => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy details'; }, 2000); });
}

function parse(raw) {
  const m = raw.match(/<<<REQUEST_JSON\n([\s\S]+?)\nREQUEST_JSON>>>/);
  const txt = raw.replace(/<<<REQUEST_JSON[\s\S]+?REQUEST_JSON>>>/g, '').trim();
  if (txt) { history.push({ role: 'assistant', content: txt }); addMsg('bot', txt); }
  if (m) { try { showCard(JSON.parse(m[1])); } catch(e) { console.error(e); } }
}

async function callAPI(msg) {
  history.push({ role: 'user', content: msg });
  // Calls Netlify function — API key never exposed to browser
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM,
      messages: history.map(m => ({ role: m.role, content: m.content }))
    })
  });
  if (!res.ok) throw new Error('API ' + res.status);
  const d = await res.json();
  return d.content.map(b => b.text || '').join('');
}

async function send() {
  const inp = document.getElementById('mi');
  const txt = inp.value.trim();
  if (!txt || loading) return;
  inp.value = ''; inp.style.height = 'auto';
  loading = true; document.getElementById('sb').disabled = true;
  addMsg('user', txt); showTyping();
  try {
    const r = await callAPI(txt); hideTyping(); parse(r);
  } catch(e) {
    hideTyping(); addMsg('bot', 'Something went wrong. Please try again or contact the LOFT team directly.'); console.error(e);
  }
  loading = false; document.getElementById('sb').disabled = false; inp.focus();
}

function sc(t) { document.getElementById('mi').value = t; send(); }
function hk(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function ar(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 110) + 'px'; }
</script>
</body>
</html>
