body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */

.lw{display:flex;align-items:center;gap:11px}
.lm{width:36px;height:36px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#000;letter-spacing:-1px;font-family:var(--font)}
.lt{display:flex;flex-direction:column}
.ln{font-size:14px;font-weight:700;letter-spacing:2.5px;color:var(--text)}
.ls{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.sp{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:var(--gdim);padding:4px 11px;border-radius:20px;border:1px solid var(--gborder);font-weight:500}
.sd{width:5px;height:5px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* CHIPS */
.cb{display:flex;gap:6px;padding:9px 14px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--s1);flex-shrink:0;scrollbar-width:none}
.cb::-webkit-scrollbar{display:none}
.ch{flex-shrink:0;background:var(--s2);border:1px solid var(--border);color:var(--mid);padding:5px 13px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:var(--font);font-weight:500;letter-spacing:.2px}
.ch:hover{background:var(--gdim);border-color:rgba(125,196,100,.3);color:var(--green)}

/* CHAT */
#chat{flex:1;overflow-y:auto;padding:20px 15px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:#161616 transparent}
#chat::-webkit-scrollbar{width:3px}
#chat::-webkit-scrollbar-thumb{background:#161616}

/* MESSAGES */
.msg{display:flex;gap:9px;max-width:88%;animation:fu .25s ease}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.bot{align-self:flex-start}
.av{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font)}
.bot .av{background:var(--green);color:#000;font-size:14px}
.user .av{background:#161616;color:var(--dim);font-size:9px;font-weight:600}
.bb{padding:11px 15px;border-radius:13px;font-size:14px;line-height:1.7;max-width:100%;font-weight:400}
.bot .bb{background:var(--botbg);border:1px solid var(--botborder);border-radius:3px 13px 13px 13px}
.user .bb{background:#131313;border:1px solid var(--border);border-radius:13px 3px 13px 13px}
.bb p{margin-bottom:6px}.bb p:last-child{margin-bottom:0}
.bb strong{color:var(--green);font-weight:600}
.bb ul{padding-left:17px;margin:5px 0}.bb li{margin:3px 0}

/* TYPING */
.typing .bb{padding:14px 17px}
.dots{display:flex;gap:4px;align-items:center}
.dots span{width:5px;height:5px;background:var(--green);border-radius:50%;animation:bounce 1.1s infinite;opacity:.6}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* FEEDBACK */
.feedback-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.fb-label{font-size:11px;color:var(--mid)}
.fb-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;transition:all .2s;color:var(--mid);font-family:var(--font)}
.fb-btn:hover{border-color:rgba(125,196,100,.3);color:var(--green);background:var(--gdim)}
.fb-btn.selected-good{border-color:var(--green);color:var(--green);background:var(--gdim)}
.fb-btn.selected-bad{border-color:#e05555;color:#e05555;background:rgba(224,85,85,.08)}
.fb-thanks{font-size:11px;color:var(--green)}

.rc{background:#040c04;border:1px solid rgba(125,196,100,.22);border-radius:11px;padding:14px;margin-top:5px}
.rch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rcat{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--green);background:var(--gdim);padding:3px 8px;border-radius:4px}
.rtid{font-size:10px;color:var(--dim);font-family:monospace}
.rsm{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.rmt{font-size:12px;color:var(--mid);line-height:1.8;margin-bottom:10px}
.rmt span{color:var(--text)}
.rst{font-size:11px;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:5px;font-weight:500}
.rst::before{content:'';display:inline-block;width:5px;height:5px;background:var(--green);border-radius:50%}
.ra{display:flex;gap:7px;flex-wrap:wrap}
.rb{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .2s;font-family:var(--font)}
.rb.wa{background:#0e6e38;color:#fff}.rb.wa:hover{background:#0a5a2e}
.rb.cp{background:var(--s2);color:var(--mid);border:1px solid var(--border)}.rb.cp:hover{color:var(--text)}

/* WELCOME */
.wl{align-self:center;text-align:center;padding:28px 18px;max-width:320px}
.wlo{width:52px;height:52px;background:var(--green);border-radius:13px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#000;letter-spacing:-1.5px;font-family:var(--font)}
.wl h2{font-size:19px;font-weight:700;letter-spacing:-.4px;margin-bottom:7px;color:var(--text)}
.wl p{font-size:13px;color:var(--dim);line-height:1.65}
.wcs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px}
.wc{background:var(--s2);border:1px solid var(--border);color:var(--mid);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s;font-family:var(--font);font-weight:500}
.wc:hover{background:var(--gdim);border-color:rgba(125,196,100,.3);color:var(--green)}

/* INPUT */
.ia{padding:11px 15px 13px;padding-bottom:max(13px,env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--s1);flex-shrink:0}
.ir{display:flex;gap:8px;align-items:flex-end}
#mi{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-size:14px;font-family:var(--font);resize:none;outline:none;max-height:110px;min-height:43px;transition:border-color .2s;line-height:1.55;font-weight:400}

#mi::placeholder{color:var(--dim)}
#sb{width:43px;height:43px;background:var(--green);border:none;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}

LOFT is a community — a curated environment for founders, freelancers, designers, and operators building something real. A full space with the wrong energy is worse than a half-full space with the right energy.

TRANSCRIPT:

    keys: ['archetype','explorer','builder','visionary','connector','creative','supporter','builder tag'],
    answer: `**LOFT Member Archetypes**\n\n- **Explorer** — early stage, testing ideas\n- **Creative Head** — designer, writer, maker\n- **Builder** — founder, operator\n- **Visionary** — big picture thinker\n- **Connector** — knows and introduces everyone\n- **Supporter** — legal, finance, HR, ops\n\nEach archetype has a physical Builder Tag in the space.`
  },
  {
    keys: ['hello','hi','hey','good morning','good afternoon','namaste','sup','what can you do','help me','start'],
    answer: `Hi! I'm the LOFT Community Assistant.\n\nI can help you with:\n- Events and bookings\n- Membership and pricing\n- WiFi and access\n- Meeting room bookings\n- Raising a request\n- Connecting you with the team\n\nWhat do you need?`
  }
];

function findLocalAnswer(input) {
  const q = input.toLowerCase().trim();
  for (const qa of LOCAL_QA) {
    if (qa.keys.some(k => q.includes(k))) return qa.answer;
  }
  return null;
}

async function saveTicket(r) {
  if (!db) return null;
  try {
    const ref = await db.collection('loft_tickets').add({
      category: r.category, memberName: r.name, cabin: r.cabin,
      email: r.email || '', description: r.description, summary: r.summary,
      status: 'open', assignedTo: '', staffNotes: '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      closedAt: null
    });
    return ref.id;
  } catch(e) { console.error('Firestore:', e); return null; }
}

async function saveFeedback(f) {
  if (!db) return;
  try {
    await db.collection('loft_feedback').add({
      name: f.name || 'Anonymous', feedback: f.feedback, sentiment: f.sentiment,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { console.error('Feedback save:', e); }

  // WhatsApp Ankur with the feedback
  const msg = encodeURIComponent(
    'LOFT Feedback Received' +
    '\n\nFrom: ' + (f.name || 'Anonymous') +
    '\nSentiment: ' + (f.sentiment || 'unknown') +
    '\n\n' + f.feedback
  );
  window.open('https://wa.me/' + WA + '?text=' + msg, '_blank');
}

async function sendStaffEmail(r, tid) {
  if (EJ_PK === 'YOUR_EMAILJS_PUBLIC_KEY') return;
  try {
    await emailjs.send(EJ_SVC, EJ_NEW_TPL, {
      ticket_id: tid ? tid.slice(0,8).toUpperCase() : 'N/A',
      category: r.category.toUpperCase(),
      member_name: r.name, cabin: r.cabin,
      member_email: r.email || 'Not provided',
      description: r.description, to_email: STAFF_EMAIL
    });

}

async function sendMemberConfirm(r, tid) {
  if (!r.email || EJ_CONFIRM_TPL === 'YOUR_MEMBER_CONFIRM_TEMPLATE') return;
  try {
    await emailjs.send(EJ_SVC, EJ_CONFIRM_TPL, {
      ticket_id: tid ? tid.slice(0,8).toUpperCase() : 'N/A',

      member_name: r.name, cabin: r.cabin,
      description: r.description, to_email: r.email
    });

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function addMsg(role, text, showFeedback = false) {
  const chat = document.getElementById('chat');
  const wl = chat.querySelector('.wl'); if (wl) wl.remove();
  const w = document.createElement('div'); w.className = 'msg ' + role;
  const av = document.createElement('div'); av.className = 'av'; av.textContent = role === 'bot' ? 'L' : 'ME';
  const bb = document.createElement('div'); bb.className = 'bb';
  const fmt = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/((<li>.*?<\/li>\n?)+)/gs, '<ul>$1</ul>')
    .split('\n\n').map(p => '<p>' + p.replace(/\n/g,'<br>') + '</p>').join('');
  bb.innerHTML = fmt;

  if (role === 'bot' && showFeedback) {
    const fr = document.createElement('div'); fr.className = 'feedback-row';
    fr.innerHTML = `<span class="fb-label">Was this helpful?</span>
      <button class="fb-btn" onclick="submitFeedback(this,'good')">Yes</button>
      <button class="fb-btn" onclick="submitFeedback(this,'bad')">No</button>`;
    bb.appendChild(fr);
  }

  w.appendChild(av); w.appendChild(bb);
  chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
}

function submitFeedback(btn, type) {
  const row = btn.closest('.feedback-row');
  row.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('selected-good','selected-bad'));
  btn.classList.add(type === 'good' ? 'selected-good' : 'selected-bad');
  if (db) {
    db.collection('loft_chat_feedback').add({
      type, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(e => console.error(e));
  }
  setTimeout(() => {
    row.innerHTML = '<span class="fb-thanks">Thank you for the feedback.</span>';
  }, 600);
}

  const w = document.createElement('div'); w.className = 'msg bot typing'; w.id = 'typing';
  w.innerHTML = '<div class="av">L</div><div class="bb"><div class="dots"><span></span><span></span><span></span></div></div>';

function cpTicket(btn, id, cat, name, cabin, desc) {
  navigator.clipboard.writeText(`LOFT ${cat.toUpperCase()} REQUEST\nTicket: #${id}\nMember: ${name}\nSpace: ${cabin}\n\n${desc}`)
    .then(() => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy details'; }, 2000); });
}

let msgCount = 0;
function parse(raw) {
  const reqMatch = raw.match(/<<<REQUEST_JSON\n([\s\S]+?)\nREQUEST_JSON>>>/);
  const fbMatch  = raw.match(/<<<FEEDBACK_JSON\n([\s\S]+?)\nFEEDBACK_JSON>>>/);
  let txt = raw
    .replace(/<<<REQUEST_JSON[\s\S]+?REQUEST_JSON>>>/g, '')
    .replace(/<<<FEEDBACK_JSON[\s\S]+?FEEDBACK_JSON>>>/g, '')
    .trim();

  msgCount++;
  const showFb = !reqMatch && !fbMatch && msgCount % 3 === 0;

  if (txt) { history.push({ role: 'assistant', content: txt }); addMsg('bot', txt, showFb); }
  if (reqMatch) { try { showCard(JSON.parse(reqMatch[1])); } catch(e) { console.error(e); } }
  if (fbMatch)  { try { saveFeedback(JSON.parse(fbMatch[1])); } catch(e) { console.error(e); } }
}

async function callAPI(msg) {
  history.push({ role: 'user', content: msg });
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514', max_tokens: 1000,
      system: SYSTEM,
      messages: history.map(m => ({ role: m.role, content: m.content }))
    })
  });
  if (!res.ok) throw new Error('API ' + res.status);
  const d = await res.json();
  return d.content.map(b => b.text || '').join('');
}

async function send() {
  const inp = document.getElementById('mi');
  const txt = inp.value.trim();
  if (!txt || loading) return;
  inp.value = ''; inp.style.height = 'auto';
  loading = true; document.getElementById('sb').disabled = true;
  addMsg('user', txt);

  // Check local Q&A first — no API call needed
  const localAnswer = findLocalAnswer(txt);
  if (localAnswer) {
    setTimeout(() => {
      msgCount++;
      const showFb = msgCount % 3 === 0;
      history.push({ role: 'user', content: txt });
      history.push({ role: 'assistant', content: localAnswer });
      addMsg('bot', localAnswer, showFb);
      loading = false;
      document.getElementById('sb').disabled = false;
      inp.focus();
    }, 400);
    return;
  }

  // Rate limiting check
  const now = Date.now();
  if (apiCallsThisSession >= SESSION_LIMIT) {
    addMsg('bot', 'You have reached the session limit. Please WhatsApp the LOFT team at +91 86008 88073 for further help.');
    loading = false; document.getElementById('sb').disabled = false; inp.focus();
    return;
  }
  if (now - lastCallTime < MIN_GAP_MS) {
    setTimeout(() => { loading = false; document.getElementById('sb').disabled = false; inp.focus(); }, 500);
    return;
  }
  lastCallTime = now;
  apiCallsThisSession++;

  showTyping();
  try { const r = await callAPI(txt); hideTyping(); parse(r); }
  catch(e) { hideTyping(); addMsg('bot', 'Something went wrong. Please try again or WhatsApp us at +91 86008 88073.'); console.error(e); }
  loading = false; document.getElementById('sb').disabled = false; inp.focus();
}

function sc(t) { document.getElementById('mi').value = t; send(); }

function buildTranscript() {
  const lines = [];
  lines.push('LOFT Help Desk - Chat Transcript');
  lines.push('Date: ' + new Date().toLocaleString('en-IN'));
  lines.push('---');
  history.forEach(function(m) {
    const role = m.role === 'user' ? 'Member' : 'LOFT AI';
    const text = m.content.split('**').join('').split('\n').join(' ');
    lines.push(role + ': ' + text);
  });
  return lines.join('\n');
}

function sendTranscript() {
  if (history.length < 2) {
    alert('No conversation to send yet.');
    return;
  }
  const transcript = buildTranscript();
  const btn = document.getElementById('transcript-btn');
  
  // Show options
  const choice = confirm('Send transcript to:\n\nOK = WhatsApp\nCancel = Email');
  
  if (choice) {
    // WhatsApp
    const msg = encodeURIComponent(transcript.slice(0, 1500) + (transcript.length > 1500 ? '\n[truncated]' : ''));
    window.open('https://wa.me/' + WA + '?text=' + msg, '_blank');
  } else {
    // Email via EmailJS
    if (EJ_PK === 'YOUR_EMAILJS_PUBLIC_KEY') {
      alert('Email not configured yet.');
      return;
    }
    emailjs.send(EJ_SVC, EJ_NEW_TPL, {
      ticket_id: 'TRANSCRIPT',
      category: 'CHAT TRANSCRIPT',
      member_name: 'Member',
      cabin: 'N/A',
      member_email: 'N/A',
      description: transcript.slice(0, 3000),
      to_email: STAFF_EMAIL
    }).then(() => {
      btn.textContent = 'Sent';
      setTimeout(() => { btn.textContent = 'Send transcript'; }, 3000);
    }).catch(e => {
      console.error(e);
      alert('Could not send. Try WhatsApp instead.');
    });
  }
}
